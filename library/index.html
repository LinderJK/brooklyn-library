<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brooklyn Public Library</title>
    <meta name="description" content="Brooklyn Public Library">
    <meta name="keywords" content="library, books, library in brooklyn">
    <link rel="icon" href="#" type="image/x-icon">

    <link rel="stylesheet" type="text/css" href="./css/normalize.css" charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="./css/style.css" charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Forum&family=Inter:wght@400;700&display=swap" rel="stylesheet">



</head>

<body>
    <div class="wrapper">


        <header class="header">
            <div class="header__container">

                <div class="header__elements">
                    <div class="header__logo">
                        <h1 class="title header__title ">Brooklyn Public Library</h1>
                    </div>
                    <nav class="nav header__nav">
                        <ul class="nav__list">
                            <li class="nav__item">
                                <a class="nav__link nav__link--active" href="">About</a>
                            </li>
                            <li class="nav__item">
                                <a class="nav__link" href="">Favorites</a>
                            </li>
                            <li class="nav__item">
                                <a class="nav__link" href="">Coffee shop</a>
                            </li>
                            <li class="nav__item">
                                <a class="nav__link" href="">Contacts</a>
                            </li>
                            <li class="nav__item">
                                <a class="nav__link" href="">Library Card</a>
                            </li>
                        </ul>
                    </nav>
                    <div class="auth-icon">
                        <a class="auth-icon__link" href="#">
                            <img class="auth-icon__img" src="./img/auth-icon-img.svg" alt="login user">
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">

            <section class="welcome">
                <div class="welcome__container">
                    <div class="welcome__text-block">
                        <h2 class="title welcome__title">Welcome<br />to the Brooklyn Library</h2>
                    </div>
                    <div class="welcome__image">
                        <div class="welcome__overlay"></div>
                    </div>
                </div>
            </section>

            <section class="about">
                <div class="about__container">
                    <div class="about__content content">
                        <div class="main__title-block">
                            <h2 class="title main__title">About</h2>
                            <hr color="#000">
                        </div>

                        <div class="main__description">
                            <p>The Brooklyn Library is a free workspace, a large number of books and a cozy coffee shop
                                inside </p>
                        </div>

                        <div class="slider">
                            <div class="slider__item-list">
                                <div class="slider__item">
                                    <img class="slider__image" src="./img/slider-image/slider-img-1.jpeg" alt="">
                                </div>

                                <div class="slider__item">
                                    <img class="slider__image" src="./img/slider-image/slider-img-2.jpeg" alt="">
                                </div>

                                <div class="slider__item">
                                    <img class="slider__image" src="./img/slider-image/slider-img-3.jpeg" alt="">
                                </div>
                            </div>

                            <ul class="slider__navigation-list">
                                <!--? span or button -->
                                <li class="slider__navigation-item">
                                    <span class="slider__dot slider__dot--active"></span>
                                </li>
                                <li class="slider__navigation-item">
                                    <span class="slider__dot"></span>
                                </li>
                                <li class="slider__navigation-item">
                                    <span class="slider__dot"></span>
                                </li>
                            </ul>
                        </div>

                    </div>
                </div>
            </section>

            <section class="favorites">
                <div class="favorites__container">
                    <div class="favorites__content content">

                        <div class="main__title-block">
                            <h2 class="title main__title">Favorites</h2>
                            <hr color="#000">
                        </div>

                        <div class="favorites__season">
                            <p><b>Pick favorites of season</b></p>
                            
                           
                        </div>

                        <div class="radio-button">
                            <label class="radio-button__item" for="winter">
                                <input type="radio" id="winter" name="season" value="1" checked>
                                <span></span>
                                <p>Winter</p>
                            </label>
                            <label class="radio-button__item" for="spring">
                                <input  type="radio" id="spring" name="season" value="2">
                                <span></span>
                                <p>Spring</p>
                                
                                
                            </label>
                            <label class="radio-button__item" for="summer">
                                <input type="radio" id="summer" name="season" value="2" >
                                <span></span>
                                <p>Summer</p>
                            </label>
                            <label class="radio-button__item" for="autumn">
                                <input  type="radio" id="autumn" name="season" value="2" >
                                <span></span>
                                <p>Autumn</p>
                            </label>

                        </div>

                       
                        
                        

                        


                    </div>
                </div>
            </section>



        </main>
        <footer class="footer">

        </footer>











    </div>
</body>

</html>
